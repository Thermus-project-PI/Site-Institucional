<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/stylesDashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/styleDashboardSensores.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>Dashboard - Obras</title>
</head>

<body>

    <aside>
        <div class="top">
            <div class="logo-container">
                <img src="../img/logo-fina.svg" alt="logo" class="logo">
            </div>
            <div class="links-container">
                <div class="link" onclick="window.location.href = 'index.html'">
                    <p>Dashboard</p>
                </div>
                <div class="link selected" onclick="window.location.href = 'sensores.html'">
                    <p>Obras</p>
                </div>
                <div class="link" onclick="window.location.href = 'alertas.html'">
                    <p>Alertas</p>
                </div>
                <div class="link" onclick="window.location.href = 'relatorios.html'">
                    <p>Relatórios</p>
                </div>
            </div>
        </div>
        <div class="bottom">
            <div class="btn-container">
                <button class="btn" onclick="window.location.href='../auth/funcionario/cadastroUser.html'">
                    <span>Cadastrar funcionário</span>
                </button>
                <button class="btn" onclick="window.location.href='../index.html'">
                    <span>Sair</span>
                    <i class="fa-solid fa-arrow-right-from-bracket btn-icon-logout"></i>
                </button>
            </div>
        </div>
    </aside>
    <div class="content">

        <div class="container-lista">
            <input oninput="filtrarQuadros()" id="ipt_filtroQuadro" type="text" class="pesquisa" placeholder="Buscar quadro">
            <div class="lista" id="lista"></div>
        </div>


        <div class="conteudo">

            <div class="topo">
                <h2 id="nome"></h2>
                <p id="sala"></p>
                <p id="status"></p>
            </div>

            <div class="dados">
                <div class="caixa">
                    <p>Temp média</p>
                    <h3 id="temp"></h3>
                </div>

                <div class="caixa">
                    <p>Umidade média</p>
                    <h3 id="umi"></h3>
                </div>

                <div class="caixa">
                    <p>Alertas</p>
                    <h3 id="alerta"></h3>
                </div>
            </div>

            <div class="grafico" id="grafico"></div>

        </div>

    </div>

    <script>

        const lista = document.querySelector("#lista");
        const nome = document.querySelector("#nome");
        const sala = document.querySelector("#sala");
        const status = document.querySelector("#status");
        const temp = document.querySelector("#temp");
        const umi = document.querySelector("#umi");
        const alerta = document.querySelector("#alerta");
        const grafico = document.querySelector("#grafico");

        let graf;


        function montar(nomeQuadro) {
            lista.innerHTML = "";

            fetch("/obras/obterQuadros/" + sessionStorage.ID_USUARIO).then(
                function (resposta) {
                    resposta.json().then(function (obras) {
                        for (let i = 0; i < obras.length; i++) {
                            if (nomeQuadro == "" || obras[i].quadroNome.includes(nomeQuadro)) {


                                fetch("/obras/obterStatusQuadro/" + sessionStorage.ID_USUARIO + "/" + obras[i].quadroNome)
                                    .then(function (respostaStatus) {
                                        respostaStatus.json().then(function (status) {
                                            let data = new Date(status[0].dataHora)
                                            lista.innerHTML +=
                                                `<div class='cardSensor' onclick='trocar(${obras[i].quadroNome})'>
                                                <div class='top-card'>
                                                    <b>${obras[i].quadroNome}</b>
                                                    <span class='badge'>${status[0].status_atual}</span>
                                                </div>
                                                <div class='valores'>${status[0].temperatura}°C | ${status[0].umidade}%</div>
                                                <div class='hora'>${data.toLocaleDateString()} | ${data.toLocaleTimeString()}</div>
                                            </div>`;
                                        })
                                    })
                            }
                        }
                    })
                }
            )

        }

        function trocar(i) {
            let d = listaDados[i];

            nome.innerHTML = d.nome;
            sala.innerHTML = d.sala;

            let somaT = 0;
            let somaU = 0;
            let alertas = 0;

            let temps = [];
            let umis = [];
            let horas = [];

            for (let j = 0; j < d.dados.length; j++) {
                somaT += d.dados[j].t;
                somaU += d.dados[j].u;

                temps.push(d.dados[j].t);
                umis.push(d.dados[j].u);
                horas.push(d.dados[j].h);

                if (d.dados[j].u > 80) {
                    alertas++;
                }
            }

            temp.innerHTML = (somaT / d.dados.length).toFixed(1) + "°C";
            umi.innerHTML = (somaU / d.dados.length).toFixed(0) + "%";
            alerta.innerHTML = alertas;

            status.innerHTML = alertas > 0 ? "ALERTA" : "OK";


            grafico.innerHTML = "<canvas></canvas>";
            const ctx = grafico.querySelector("canvas");


            const humidity = {
                label: 'Umidade',
                data: umis,
                borderWidth: 1,
                borderColor: "#2E6AA3",
                backgroundColor: "#2E6AA320",
                fill: true
            };

            const temperature = {
                label: 'Temperatura',
                data: temps,
                borderWidth: 1,
                borderColor: "#348A6F",
                backgroundColor: "#348A6F20",
                fill: true
            };

            let dataset = temperature;

            graf = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: horas,
                    datasets: [temperature, humidity]
                },
                options: {
                    scales: {
                        y: {
                            min: 0,
                            max: 100,
                            beginAtZero: true,
                            ticks: {
                                stepSize: 10
                            }
                        }
                    }
                }
            });


            window.change = function (tipo) {
                if (tipo === "temperature") {
                    graf.data.datasets[0] = temperature;
                } else if (tipo === "humidity") {
                    graf.data.datasets[0] = humidity;
                }
                graf.update();
            }
        }

        function filtrarQuadros() {
            montar(ipt_filtroQuadro.value);
        }


        montar("");
        // trocar(0);

    </script>

</body>

</html>
