    <div class="content">

        <div class="container-lista">
            <input oninput="filtrarQuadros()" id="ipt_filtroQuadro" type="text" class="pesquisa"
                placeholder="Buscar quadro">
            <div class="lista" id="lista"></div>
        </div>


        <div class="conteudo">

            <div class="topo">
                <h2 id="nome"></h2>
                <p id="sala"></p>
                <p id="status"></p>
            </div>

            <div class="dados">
                <div class="caixa">
                    <p>Temp média</p>
                    <h3 id="temp"></h3>
                </div>

                <div class="caixa">
                    <p>Umidade média</p>
                    <h3 id="umi"></h3>
                </div>

                <div class="caixa">
                    <p>Alertas</p>
                    <h3 id="alerta"></h3>
                </div>
            </div>

            <div class="grafico" id="grafico"></div>

        </div>

    </div>

    <script>

        function montar(nomeQuadro) {
            lista.innerHTML = "";

            fetch("/obras/obterQuadros/" + sessionStorage.ID_USUARIO).then(
                function (resposta) {
                    resposta.json().then(function (obras) {
                        for (let i = 0; i < obras.length; i++) {
                            if (nomeQuadro == "" || obras[i].quadroNome.includes(nomeQuadro)) {


                                fetch("/obras/obterStatusQuadro/" + sessionStorage.ID_USUARIO + "/" + obras[i].quadroNome)
                                    .then(function (respostaStatus) {
                                        respostaStatus.json().then(function (statusResposta) {
                                            let data = new Date(statusResposta[0].dataHora)
                                            lista.innerHTML +=
                                                `<div class='cardSensor' onclick='trocar("${obras[i].quadroNome}")'>
                                                <div class='top-card'>
                                                    <b>${obras[i].quadroNome}</b>
                                                    <span class='badge'>${statusResposta[0].status_atual}</span>
                                                </div>
                                                <div class='valores'>${statusResposta[0].temperatura}°C | ${statusResposta[0].umidade}%</div>
                                                <div class='hora'>${data.toLocaleTimeString()}</div>
                                            </div>`;
                                        })
                                    })
                            }
                        }
                    })
                }
            )

        }

        function trocar(nomeQuadro) {

            fetch("/obras/obterStatusQuadro/" + sessionStorage.ID_USUARIO + "/" + nomeQuadro)
                .then(function (respostaStatus) {
                    respostaStatus.json().then(function (statusResposta) {
                        let data = new Date(statusResposta[0].dataHora)
                        nome.innerHTML = nomeQuadro
                        sala.innerHTML = statusResposta[0].localizacao
                        document.getElementById("status").innerHTML = statusResposta[0].status_atual
                    })
                })

            fetch("/obras/obterMediaQuadro/" + sessionStorage.ID_USUARIO + "/" + nomeQuadro)
                .then(function (resposta) {
                    resposta.json().then(function (medias) {
                        temp.innerHTML = medias[0].temperaturaMedia + " °C"
                        umi.innerHTML = medias[0].umidadeMedia + " %"
                    })
                })

            fetch("/obras/obterTotalAlerta/" + sessionStorage.ID_USUARIO + "/" + nomeQuadro)
                .then(function (resposta) {
                    resposta.json().then(function (alertas) {
                        alerta.innerHTML = alertas[0].total_alertas
                    })
                })

            // window.change = function (tipo) {
            //     if (tipo === "temperature") {
            //         graf.data.datasets[0] = temperature;
            //     } else if (tipo === "humidity") {
            //         graf.data.datasets[0] = humidity;

            //     graf.update();
            // }
        }

        function filtrarQuadros() {
            montar(ipt_filtroQuadro.value);
