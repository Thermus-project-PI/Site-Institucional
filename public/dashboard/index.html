<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/stylesDashboard.css">
    <link rel="stylesheet" href="../styles/bobIAStyle.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Dashboard</title>
</head>

<body>
    <div class="content">
        <aside>
            <div class="top">
                <div class="logo-container">
                    <img src="../img/logo-fina.svg" alt="logo" class="logo">
                </div>
                <div class="links-container">
                    <div class="link selected" onclick="window.location.href = 'index.html'">
                        <p>Dashboard</p>
                    </div>
                    <div class="link" onclick="window.location.href = 'obras.html'">
                        <p>Obras</p>
                    </div>
                    <div class="link" onclick="window.location.href = 'alertas.html'">
                        <p>Alertas</p>
                    </div>
                    <div class="link" onclick="window.location.href = 'relatorios.html'">
                        <p>Relatórios</p>
                    </div>
                </div>
            </div>
            <div class="bottom">
                <div class="btn-container">
                    <button class="btn" onclick="window.location.href='../auth/funcionario/cadastroUser.html'">
                        <span>Cadastrar funcionário</span>
                    </button>
                    <button class="btn" onclick="window.location.href='../index.html'">
                        <span>Sair</span>
                        <i class="fa-solid fa-arrow-right-from-bracket btn-icon-logout"></i>
                    </button>
                </div>
            </div>
        </aside>
        <main>
            <div class="left">
                <div class="cards-container">
                    <div class="card">
                        <div class="icon-container icon-green">
                            <i class="fa-solid fa-temperature-full"></i>
                        </div>
                        <div class="card-title">
                            <h1>Temperatura média</h1>
                        </div>
                        <div class="main-info main-info-green">
                            <h1 id="temperaturaMediaHT"></h1>
                        </div>
                        <div class="sub-info">
                            <h2 id="data_atual_temp">Hoje - 04/05/2026</h2>
                            <h2>todos os sensores</h2>
                        </div>
                    </div>
                    <div class="card">
                        <div class="icon-container icon-blue">
                            <i class="fa-solid fa-droplet"></i>
                        </div>
                        <div class="card-title">
                            <h1>Umidade média</h1>
                        </div>
                        <div class="main-info main-info-blue">
                            <h1 id="umidadeMediaHT"></h1>
                        </div>
                        <div class="sub-info">
                            <h2 id="data_atual_umid"></h2>
                            <h2>todos os sensores</h2>
                        </div>
                    </div>
                    <div class="card" onclick="window.location.href='./alertas.html'" style="cursor: pointer;">
                        <div class="icon-container icon-red">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="card-title">
                            <h1>Alertas Hoje</h1>
                        </div>
                        <div class="main-info main-info-red">
                            <h1 id="alertasHojeHT"></h1>
                        </div>
                        <div class="sub-info">
                            <h2 id="legendasAlertasHT"></h2>
                        </div>
                    </div>
                    <div class="card">
                        <div class="icon-container icon-yellow">
                            <i class="fa-solid fa-circle-exclamation"></i>
                        </div>

                        <div class="card-title">
                            <h1>Proximidade do Orvalho</h1>
                        </div>
                        <div class="main-info main-info-yellow">
                            <h1 id="pontoOrvalhoHT"></h1>
                        </div>
                        <div class="sub-info point-risc">
                            <h2>Risco de orvalho atual: </h2>
                            <span id="statusOrvalho"></span>
                        </div>
                    </div>
                </div>
                <div class="charts">
                    <div class="buttons">
                        <h1>filtros:</h1>

                        <button class="btn-chart btn-chart-umidity" onclick="change('humidity')">Umidade</button>

                        <button class="btn-chart btn-chart-temperature"
                            onclick="change('temperature')">Temperatura</button>

                    </div>
                    <div class="chart flex" id="umid-div">
                        <canvas id="chart"></canvas>
                    </div>
                </div>
            </div>
            <div class="right">
                <div class="last-alerts">
                    <div class="last-alerts-title">
                        <h1>Últimos alertas do dia</h1>
                    </div>
                    <div class="last-alerts">
                        <div class="last-alerts-title">
                            <h1>Últimos alertas do dia</h1>
                        </div>
                        <div class="alerts" id="containerAlertas">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="chatClosed" id="bobIA">
        <h1 id="circleContent">?</h1>
        <div class="content" id="bobContent">
            <div class="top">
                <h1>BOBIA</h1>
                <img src="../img/close.svg" id="closeBtn">
            </div>
            <div class="chat" id="chat">
            </div>
            <div class="bottom">
                <input type="text" id="userContent">
                <img src="../img/sent.svg" id="send">  
            </div>
        </div>
    </div>
</body>
<script src="../scripts/bobIA.js"></script>
<script>
    window.onload = function () {

        function atualizarDatasParaHoje() {
            var hoje = new Date();

            var dataFormatada = hoje.toLocaleDateString('pt-BR');

            document.getElementById("data_atual_temp").innerHTML = `Hoje - ${dataFormatada}`;
            document.getElementById("data_atual_umid").innerHTML = `Hoje - ${dataFormatada}`;
        }
        atualizarDatasParaHoje()

        fetch(`/indexDash/temperaturaMedia/${sessionStorage.ID_USUARIO}`)
            .then(function (resposta) {

                if (!resposta.ok) {
                    throw new Error("Erro na API");
                }

                return resposta.json();

            })
            .then(function (dados) {

                temperaturaMediaHT.innerHTML = `${dados[0].temperatura_media} °C`;

            })
            .catch(function (erro) {

                console.log("Erro:", erro);

            });

        fetch(`/indexDash/umidadeMedia/${sessionStorage.ID_USUARIO}`)
            .then(function (resposta) {

                if (!resposta.ok) {
                    throw new Error("Erro na API");
                }

                return resposta.json();

            })
            .then(function (dados) {

                umidadeMediaHT.innerHTML = `${dados[0].umidade_media}%`;

            })
            .catch(function (erro) {

                console.log("Erro:", erro);

            });

        fetch(`/indexDash/pontoOrvalho/${sessionStorage.ID_USUARIO}`)
            .then(resposta => resposta.json())
            .then(dados => {
                let valor = dados[0].ponto_orvalho;
                let elementoValor = document.getElementById("pontoOrvalhoHT");
                let spanStatus = document.getElementById("statusOrvalho");
                let iconContainer = document.querySelector(".icon-container.icon-yellow");

                elementoValor.innerHTML = `${valor}°C`;

                iconContainer.className = "icon-container";

                if (valor <= 4) {
                    elementoValor.className = "main-info main-info-red";
                    iconContainer.classList.add("icon-red");
                    spanStatus.innerHTML = "CRÍTICO";
                    spanStatus.style.color = "#D24848";
                } else if (valor <= 7) {
                    elementoValor.className = "main-info main-info-yellow";
                    iconContainer.classList.add("icon-yellow");
                    spanStatus.innerHTML = "ATENÇÃO";
                    spanStatus.style.color = "rgb(255, 191, 0)";
                } else {
                    elementoValor.className = "main-info main-info-green";
                    iconContainer.classList.add("icon-green");
                    spanStatus.innerHTML = "OK";
                    spanStatus.style.color = "#348A6F";
                }
            })
            .catch(erro => console.log("Erro no Orvalho:", erro));

        fetch(`/indexDash/alertas/${sessionStorage.ID_USUARIO}`)
            .then(function (resposta) {

                if (!resposta.ok) {
                    throw new Error("Erro na API");
                }

                return resposta.json();

            })
            .then(function (dados) {

                console.log("ALERTAS:", dados);

                let total = dados[0].total_alertas;
                let criticos = dados[0].total_criticos;
                let atencao = dados[0].total_atencao;

                alertasHojeHT.innerHTML = total;
                legendasAlertasHT.innerHTML = `${criticos} Críticos / ${atencao} Atenção`;
            })
            .catch(function (erro) {

                console.log("Erro:", erro);

            });

        fetch(`/indexDash/ultimosAlertas/${sessionStorage.ID_USUARIO}`)
            .then(resposta => resposta.json())
            .then(listaAlertas => {
                console.log(listaAlertas)
                containerAlertas.innerHTML = "";

                for (let i = 0; i < listaAlertas.length; i++) {
                    let alerta = listaAlertas[i];

                    let statusClass = alerta.status_atual === 'CRÍTICO' ? 'alert-status-red' : 'alert-status-yellow';

                    containerAlertas.innerHTML += `
                    <div class="alert">
                        <div class="circle"></div>
                        <div class="alert-title">${alerta.quadroNome}</div>
                        <div class="alert-info">
                            <h2>${alerta.hora}</h2>
                            <h2>Umidade ${alerta.umidade}%</h2>
                            <h2>Temp ${alerta.temperatura}°C</h2>
                        </div>
                        <div class="alert-status ${statusClass}">
                            <h1>${alerta.status_atual}</h1>
                        </div>
                    </div>
                `;
                }
            });


        let ctx = document.getElementById('chart').getContext('2d');

        let graf = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Dados',
                        data: [],
                        borderColor: "#348A6F",
                        fill: true
                    },
                    {
                        label: 'Mín Ideal',
                        data: [],
                        borderDash: [6, 6]
                    },
                    {
                        label: 'Máx Ideal',
                        data: [],
                        borderDash: [6, 6]
                    }
                ]
            }
        });

        let tipoAtual = 'temperature';

        function carregarTemperatura() {
            fetch(`/indexDash/graficoTemp/${sessionStorage.ID_USUARIO}`)
                .then(function (resposta) {
                    if (!resposta.ok) throw new Error("Erro na API");
                    return resposta.json();
                })
                .then(function (dados) {

                    if (!dados.length) return;

                    let novoRegistro = dados[dados.length - 1];
                    let novaTemperatura = novoRegistro.temperatura_media;
                    let novaHora = `${novoRegistro.hora}:00`;

                    graf.data.labels.push(novaHora);
                    graf.data.datasets[0].data.push(novaTemperatura);

                    if (graf.data.labels.length > 10) {
                        graf.data.labels.shift();
                        graf.data.datasets[0].data.shift();
                    }

                    let tamanhoAtual = graf.data.labels.length;
                    graf.data.datasets[1].data = Array(tamanhoAtual).fill(16);
                    graf.data.datasets[2].data = Array(tamanhoAtual).fill(20);

                    graf.update();
                })
                .catch(function (erro) {
                    console.log("Erro:", erro);
                });
        }

        function carregarUmidade() {
            fetch(`/indexDash/graficoUmidade/${sessionStorage.ID_USUARIO}`)
                .then(function (resposta) {
                    if (!resposta.ok) throw new Error("Erro na API");
                    return resposta.json();
                })
                .then(function (dados) {

                    if (!dados.length) return;

                    let novoRegistro = dados[dados.length - 1];
                    let valor = novoRegistro.umidade_media;
                    let hora = `${novoRegistro.hora}:00`;

                    graf.data.labels.push(hora);
                    graf.data.datasets[0].data.push(valor);

                    if (graf.data.labels.length > 10) {
                        graf.data.labels.shift();
                        graf.data.datasets[0].data.shift();
                    }

                    let tamanhoAtual = graf.data.labels.length;
                    graf.data.datasets[1].data = Array(tamanhoAtual).fill(40);
                    graf.data.datasets[2].data = Array(tamanhoAtual).fill(70);

                    graf.update();
                })
                .catch(function (erro) {
                    console.log("Erro:", erro);
                });
        }

        setInterval(() => {

            if (tipoAtual === 'temperature') {
                carregarTemperatura();
            } else {
                carregarUmidade();
            }

        }, 3000);


        window.change = function (tipo) {

            tipoAtual = tipo;

            graf.data.labels = [];
            graf.data.datasets[0].data = [];

            if (tipo === "humidity") {

                graf.data.datasets[0].label = 'Umidade';
                graf.data.datasets[0].borderColor = "#2E6AA3";

                graf.options.scales.y.max = 100;
                graf.options.scales.y.min = 0;


                carregarUmidade();

            } else {

                graf.data.datasets[0].label = 'Temperatura';
                graf.data.datasets[0].borderColor = "#348A6F";

                graf.options.scales.y.max = 50;
                graf.options.scales.y.min = 0;

                carregarTemperatura();
            }

            graf.update();
        };

        change('temperature');
    }



</script>

</html>
