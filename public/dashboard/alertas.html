<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../styles/stylesDashboard.css" />
    <link rel="stylesheet" href="../styles/styleDashboardAlert.css" />
    <link rel="stylesheet" href="../styles/bobIAStyle.css">
    <title>Dashboard - Alertas</title>
  </head>

  <body>
    <div class="content">
      <aside>
        <div class="top">
          <div class="logo-container">
            <img src="../img/logo-fina.svg" alt="logo" class="logo" />
          </div>
          <div class="links-container">
            <div class="link" onclick="window.location.href = 'index.html'">
              <p>Dashboard</p>
            </div>
            <div class="link" onclick="window.location.href = 'obras.html'">
              <p>Obras</p>
            </div>
            <div
              class="link selected"
              onclick="window.location.href = 'alertas.html'"
            >
              <p>Alertas</p>
            </div>
            <div
              class="link"
              onclick="window.location.href = 'relatorios.html'"
            >
              <p>Relatórios</p>
            </div>
          </div>
        </div>
        <div class="bottom">
          <div class="btn-container">
            <button
              class="btn"
              onclick="
                window.location.href = '../auth/funcionario/cadastroUser.html'
              "
            >
              <span>Cadastrar funcionário</span>
            </button>
            <button
              class="btn"
              onclick="window.location.href = '../index.html'"
            >
              <span>Sair</span>
              <i
                class="fa-solid fa-arrow-right-from-bracket btn-icon-logout"
              ></i>
            </button>
          </div>
        </div>
      </aside>
      <div class="main">
        <div class="kpis">
          <div class="kpi">
            <div class="kpi-title">
              <h2>Total de registros</h2>
            </div>
            <div class="kpi-main">
              <h1 id="kpi_total_registros"></h1>
            </div>
          </div>
          <div class="kpi">
            <div class="kpi-title">
              <h2>Atenção</h2>
            </div>
            <div class="kpi-main kpi-main-yellow">
              <h1 id="kpi_atencao"></h1>
            </div>
          </div>
          <div class="kpi">
            <div class="kpi-title">
              <h2>Crítico</h2>
            </div>
            <div class="kpi-main kpi-main-red">
              <h1 id="kpi_critico"></h1>
            </div>
          </div>
        </div>
        <div class="alertas-container">
          <div class="topAlertas">
            <div class="filters">
              <h3>Filtrar:</h3>
              <div class="filter filter-blue" onclick="montar('todos')">
                <p>Todos</p>
              </div>
              <div class="filter filter-yellow" onclick="montar('atencao')">
                <p>Atenção</p>
              </div>
              <div class="filter filter-red" onclick="montar('critico')">
                <p>Crítico</p>
              </div>
            </div>
            <div class="pesquisa">
              <input type="date" id="ipt_busca" />
              <button onclick="buscar()">Buscar</button>
            </div>
          </div>
          <div class="bottomAlertas">
            <table class="alertas" id="tabelaAlertas">
              <tr>
                <th>Data/hora</th>
                <th>Sensor</th>
                <th>Temp(°C)></th>
                <th>Umidade(%)</th>
                <th>Limite do orvalho</th>
                <th>
                  Diferença entre T° <br />
                  e limite do orvalho
                </th>
                <th>Status</th>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="chatClosed" id="bobIA">
        <h1 id="circleContent">?</h1>
        <div class="content" id="bobContent">
            <div class="top">
                <h1>BOBIA</h1>
                <img src="../img/close.svg" id="closeBtn">
            </div>
            <div class="chat" id="chat">
            </div>
            <div class="bottom">
                <input type="text" id="userContent">
                <img src="../img/sent.svg" id="send">  
            </div>
        </div>
    </div>
  </body>
</html>
<script src="../scripts/bobIA.js"></script>
<script>
  fetch(`/alertas/buscarTotalAlertas/${sessionStorage.ID_USUARIO}`)
    .then(function (resposta) {
      return resposta.json();
    })
    .then(function (dados) {
      console.log(dados);

      kpi_total_registros.innerHTML = dados[0].total_alertas;
    });

  fetch(`/alertas/buscarAlertasAtencao/${sessionStorage.ID_USUARIO}`)
    .then(function (resposta) {
      return resposta.json();
    })
    .then(function (dados) {
      console.log(dados);

      kpi_atencao.innerHTML = dados[0].alertas_atencao;
    });

  fetch(`/alertas/buscarAlertasCriticos/${sessionStorage.ID_USUARIO}`)
    .then(function (resposta) {
      return resposta.json();
    })
    .then(function (dados) {
      console.log(dados);

      kpi_critico.innerHTML = dados[0].alertas_criticos;
    });

  let alertasContainer = document.getElementById("tabelaAlertas");
  let dadosDoBanco = [];

  fetch(`/alertas/buscarAlertasAtuais/${sessionStorage.ID_USUARIO}`)
    .then(function (resposta) {
      return resposta.json();
    })
    .then(function (dados) {
      dadosDoBanco = dados;
      montar("todos");
    });

  function buscar() {
    console.log("chamou a função buscar");
    let dataDigitada = document.getElementById("ipt_busca").value;

    if (dataDigitada == "") {
      alert("Digite uma data!");
      return;
    }

    fetch(
      `/alertas/buscarAlertasPorData/${sessionStorage.ID_USUARIO}/${dataDigitada}`,
    )
      .then(function (resposta) {
        return resposta.json();
      })
      .then(function (dados) {
        dadosDoBanco = dados;
        montar("todos");
      });
  }

  function montar(type) {
    document
      .querySelectorAll("#tabelaAlertas #linha")
      .forEach((tr) => tr.remove());

    let lista = dadosDoBanco;

    if (type == "atencao") {
      lista = dadosDoBanco.filter((a) => a.status_atual == "atencao");
    } else if (type == "critico") {
      lista = dadosDoBanco.filter((a) => a.status_atual == "critico");
    }

    lista.forEach(function (alerta) {
      let classTd = alerta.status_atual == "critico" ? "td-red" : "td-yellow";
      let statusLabel =
        alerta.status_atual == "critico" ? "Crítico" : "Atenção";

      let tr = `
            <tr id="linha">
                <td>${alerta.dataHora}</td>
                <td>${alerta.quadroNome}</td>
                <td>${alerta.temperatura}</td>
                <td>${alerta.umidade}</td>
                <td>${alerta.pontoOrvalho}</td>
                <td>${alerta.diferenca}</td>
                <td class="${classTd}"><span>${statusLabel}</span></td>
            </tr>
        `;
      alertasContainer.innerHTML += tr;
    });
  }
</script>
